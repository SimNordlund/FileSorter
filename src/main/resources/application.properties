spring.application.name=file-sorter
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
spring.servlet.multipart.enabled=false

# Optional: full path to exiftool.exe, or leave blank to search PATH.
# In this file, use forward slashes for Windows paths, e.g. C:/Tools/exiftool.exe.
filesorter.exiftool-path=${EXIFTOOL_PATH:}
filesorter.exiftool-timeout-seconds=20

# Optional video metadata fallback from FFmpeg. Leave blank to search PATH for ffprobe.
filesorter.ffprobe-path=${FFPROBE_PATH:}
filesorter.ffprobe-timeout-seconds=20
